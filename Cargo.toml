[package]
name = "screenshare"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Login com Discord: chamadas HTTPS à API e tokens de sessão aleatórios
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.2"
# Confere a assinatura dos comandos que o Discord envia (/tela)
ed25519-dalek = "2"

# Binário pequeno e enxuto
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
